# Updated app. Import personal data into a separate schema; never baseline its source.
spring:
  datasource:
    url: ${COUPLES_DB_URL:${DB_URL}}
    username: ${COUPLES_DB_USERNAME:${DB_USERNAME}}
    password: ${COUPLES_DB_PASSWORD:${DB_PASSWORD}}
    hikari:
      schema: ${COUPLES_DB_SCHEMA:public}
  mail:
    host: ${COUPLES_SMTP_HOST:localhost}
    port: ${COUPLES_SMTP_PORT:1025}
    username: ${COUPLES_SMTP_USERNAME:}
    password: ${COUPLES_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${COUPLES_SMTP_AUTH:false}
      mail.smtp.ssl.enable: ${COUPLES_SMTP_SSL:false}
      mail.smtp.starttls.enable: ${COUPLES_SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${COUPLES_SMTP_STARTTLS:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/couples
    baseline-on-migrate: false
    clean-disabled: true
    default-schema: ${COUPLES_DB_SCHEMA:public}
    schemas: ${COUPLES_DB_SCHEMA:public}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: ${COUPLES_DB_SCHEMA:public}

app:
  privacy:
    closed-retention-days: ${COUPLES_CLOSED_RETENTION_DAYS:30}
  support-email: ${COUPLES_SUPPORT_EMAIL:}
  public-url: ${COUPLES_PUBLIC_URL:${RENDER_EXTERNAL_URL:http://localhost:5173}}
  personal-import:
    enabled: ${COUPLES_IMPORT_PERSONAL:false}
    source-schema: ${COUPLES_IMPORT_SOURCE_SCHEMA:public}
    owner-email: ${COUPLES_IMPORT_OWNER_EMAIL:}
    recipient-email: ${COUPLES_IMPORT_RECIPIENT_EMAIL:}
    shared-author: ${COUPLES_IMPORT_SHARED_AUTHOR:}
    time-zone: ${COUPLES_IMPORT_TIME_ZONE:Africa/Casablanca}
  identity:
    email-enabled: ${COUPLES_EMAIL_ENABLED:true}
    private-account-emails: ${COUPLES_PRIVATE_ACCOUNT_EMAILS:}
    registration-enabled: ${COUPLES_REGISTRATION_ENABLED:false}
    token-secret: ${COUPLES_TOKEN_SECRET}
    mail-from: ${COUPLES_MAIL_FROM:accounts@example.invalid}
  couples-firebase-path: ${COUPLES_FIREBASE_SERVICE_ACCOUNT_PATH:${FIREBASE_SERVICE_ACCOUNT_PATH:}}
  media:
    r2:
      endpoint: ${COUPLES_R2_ENDPOINT:${R2_ENDPOINT:}}
      bucket: ${COUPLES_R2_BUCKET:${R2_BUCKET:}}
      access-key-id: ${COUPLES_R2_ACCESS_KEY_ID:${R2_ACCESS_KEY_ID:}}
      secret-access-key: ${COUPLES_R2_SECRET_ACCESS_KEY:${R2_SECRET_ACCESS_KEY:}}
    legacy-supabase:
      url: ""
      service-role-key: ""
  jwt:
    secret: ${COUPLES_JWT_SECRET:${JWT_SECRET}}
    expiration-ms: 900000
