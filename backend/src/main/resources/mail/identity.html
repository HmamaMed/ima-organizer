<!doctype html>
<html lang="{{language}}" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{{subject}}</title>
  <style>
    body, table, td, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    table, td { mso-table-lspace:0pt; mso-table-rspace:0pt; }
    table { border-collapse:collapse; }
    img { border:0; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; }
    a[x-apple-data-detectors] { color:inherit !important; text-decoration:none !important; }
    @media only screen and (max-width:600px) {
      .outer { padding:24px 12px !important; }
      .inside { padding-left:24px !important; padding-right:24px !important; }
      .headline { font-size:32px !important; line-height:38px !important; }
      .action { display:block !important; text-align:center !important; padding-left:12px !important; padding-right:12px !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; width:100%; background-color:#f8f6f3; color:#29232a; font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none; font-size:1px; color:#f8f6f3; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden; mso-hide:all;">{{preheader}}</div>
  <table role="presentation" width="100%" style="width:100%; background-color:#f8f6f3;">
    <tr><td align="center" class="outer" style="padding:48px 20px;">
      <!--[if mso]><table role="presentation" width="560" align="center"><tr><td><![endif]-->
      <table role="presentation" width="100%" style="width:100%; max-width:560px;">
        <tr><td align="center" style="padding:0 0 30px;">
          <img src="cid:between-us-mark" width="44" height="41" alt="" style="display:block; width:44px; height:41px; margin:0 auto 10px;">
          <p style="margin:0; font-family:Georgia,'Times New Roman',serif; font-size:29px; line-height:36px; color:#482541;">Between Us</p>
        </td></tr>
        <tr><td style="background-color:#ffffff; border:1px solid #e9e1e5; border-radius:18px; overflow:hidden;">
          <table role="presentation" width="100%" style="width:100%;">
            <tr><td style="height:5px; background-color:#aa4566; font-size:1px; line-height:5px; border-radius:18px 18px 0 0;">&nbsp;</td></tr>
            <tr><td class="inside" style="padding:38px 40px 0;">
              <p style="margin:0 0 18px; color:#89642c; font-size:10px; font-weight:bold; letter-spacing:2px; line-height:17px; text-transform:uppercase;">{{eyebrow}}</p>
              <h1 class="headline" style="margin:0 0 26px; color:#482541; font-family:Georgia,'Times New Roman',serif; font-size:38px; font-weight:normal; letter-spacing:-1px; line-height:45px;">{{heading}}</h1>
              <p style="margin:0 0 12px; font-size:16px; line-height:26px;">{{greeting}}</p>
              <p style="margin:0; color:#655c65; font-size:15px; line-height:25px;">{{introduction}}</p>
            </td></tr>
            <tr><td class="inside" style="padding:30px 40px 16px;">
              <!--[if mso]>
              <v:roundrect href="{{actionUrl}}" style="height:52px;v-text-anchor:middle;width:310px;" arcsize="18%" stroke="f" fillcolor="#482541">
                <w:anchorlock/><center style="color:#ffffff;font-family:Arial,sans-serif;font-size:15px;font-weight:bold;">{{button}}</center>
              </v:roundrect>
              <![endif]-->
              <!--[if !mso]><!-- -->
              <a class="action" href="{{actionUrl}}" style="display:inline-block; padding:17px 26px; background-color:#482541; border:1px solid #482541; border-radius:9px; color:#ffffff; font-size:15px; font-weight:bold; line-height:20px; text-decoration:none; mso-hide:all;">{{button}}</a>
              <!--<![endif]-->
            </td></tr>
            <tr><td class="inside" style="padding:0 40px 28px;">
              <p style="margin:0; color:#817680; font-size:12px; line-height:20px;">{{expiry}}</p>
            </td></tr>
            <tr><td class="inside" style="padding:0 40px 28px;">
              <table role="presentation" width="100%" style="width:100%; background-color:#faf5f6; border-radius:10px;">
                <tr><td style="padding:17px 19px; border-left:3px solid #d8b4c0;">
                  <p style="margin:0; color:#756570; font-size:13px; line-height:21px;">{{safety}}</p>
                </td></tr>
              </table>
            </td></tr>
            <tr><td class="inside" style="padding:0 40px 34px;">
              <p style="margin:0 0 9px; color:#817680; font-size:12px; line-height:20px;">{{fallback}}</p>
              <p style="margin:0; font-size:11px; line-height:19px; word-break:break-all; overflow-wrap:anywhere;"><a href="{{actionUrl}}" style="color:#aa4566; text-decoration:underline; word-break:break-all;">{{actionUrl}}</a></p>
            </td></tr>
          </table>
        </td></tr>
        <tr><td align="center" style="padding:26px 18px 0;">
          <p style="margin:0 0 8px; color:#89642c; font-size:10px; font-weight:bold; letter-spacing:2px; line-height:18px;">BETWEEN US</p>
          <p style="margin:0; color:#817680; font-family:Georgia,'Times New Roman',serif; font-size:14px; font-style:italic; line-height:23px;">{{signature}}</p>
        </td></tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
  </table>
</body>
</html>
